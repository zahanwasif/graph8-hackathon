services:
  postgres:
    image: postgres:16-alpine
    container_name: debrief-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: debrief
      POSTGRES_PASSWORD: debrief
      POSTGRES_DB: debrief
    ports:
      - "5432:5432"
    volumes:
      - debrief-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debrief -d debrief"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  debrief-pgdata:
